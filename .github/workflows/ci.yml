name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: e2e
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: e2e
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: e2e
      - name: Build e2e server harness
        # Compile ahead of time so a module-cache miss (and the tobari
        # instrumented rebuild) cannot eat into the Playwright webServer
        # startup timeout. Must use the same GOFLAGS as the webServer command
        # in playwright.config.ts, or the cache warm-up is wasted.
        run: GOFLAGS="$(go tool tobari flags -exclude-analysis=modernc.org/sqlite)" go build -o /dev/null ./e2eserver
        working-directory: e2e
      - name: Run e2e tests
        run: npx playwright test
        env:
          E2E_COVERAGE: "1"
        working-directory: e2e
      - name: E2E coverage summary
        # The harness writes profiles on graceful shutdown, so they exist for
        # failed runs too — hence always().
        if: always()
        working-directory: e2e
        run: |
          if [ ! -f coverage/e2e.cover ]; then
            echo "no e2e coverage output" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### e2e Go coverage (tobari)'
            echo '```'
            go tool cover -func=coverage/e2e.cover | tail -n 1
            echo
            echo 'per-scenario profiles:'
            ls coverage/scenarios
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload e2e coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage
          path: e2e/coverage/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
